policy.updated=Last updated: October 27, 2026

# Terms page
term.title=Terms and Conditions
term.subtitle=Please read these terms carefully before using your account.
term.s1.title=1. About these terms
term.s1.body=These terms describe the general conditions for using JCash Bank services. By accessing or using the services, you agree to comply with the applicable account terms, policies, and instructions provided to you.
term.s2.title=2. Your account
term.s2.body=Keep your login credentials and verification codes confidential. You are responsible for activity performed through your account. Contact the bank promptly if you believe your account or device has been compromised.
term.s3.title=3. Payments and transactions
term.s3.body=Review transaction details before submitting a payment or transfer. Processing times, limits, and any applicable fees may vary by transaction type and will be presented where relevant.
term.s4.title=4. Safe and lawful use
term.s4.body=Use the services only for lawful purposes and do not interfere with their security or availability. We may restrict access when required to protect customers, comply with applicable requirements, or address suspected misuse.
term.s5.title=5. Updates and support
term.s5.body=These terms may be updated from time to time. Where required, we will provide notice of material changes. Contact customer support if you have questions about your account or these terms.
term.disclaimer=This page is a sample interface. Replace this text with the bank’s approved legal terms before release.

# Privacy page
privacy.title=Privacy Policy
privacy.subtitle=How information may be collected, used, and protected.
privacy.s1.title=1. Information we handle
privacy.s1.body=Depending on the services you use, information may include your contact and account details, identity verification information, transactions, and technical data needed to secure and operate the service.
privacy.s2.title=2. How information is used
privacy.s2.body=Information may be used to provide banking services, process transactions, verify identity, prevent fraud, maintain security, meet legal obligations, and respond to support requests.
privacy.s3.title=3. Sharing and disclosure
privacy.s3.body=Information may be shared with service providers supporting the bank, transaction participants, or authorities where required or permitted by applicable law. We do not describe this sample page as a substitute for the bank’s formal privacy notice.
privacy.s4.title=4. Security and retention
privacy.s4.body=Appropriate safeguards are used to protect information. Data is retained only as needed for service, security, and legal purposes, subject to applicable retention requirements.
privacy.s5.title=5. Your choices and questions
privacy.s5.body=Your privacy rights and available choices depend on your location and applicable law. Contact the bank through its official support channels for information about requests, corrections, or privacy questions.
privacy.disclaimer=This page is a sample interface. Replace this text with the bank’s approved privacy notice before release.

